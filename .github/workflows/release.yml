name: Release

# Triggered by pushing a version tag. Builds every supported target, ships the
# binary already named `sk2` (the crate builds `simpleKeychain2`, but users are
# told to use `sk2` -- releases should not make them do the rename), attests
# provenance, and assembles a DRAFT release with a SHA256SUMS file.
#
# Publishing is deliberately manual. The checksum signature is made on the
# maintainer's machine with a key that never touches GitHub, so tampering
# with the release AFTER this workflow has run -- swapped assets, a stolen
# account uploading new ones -- would require the maintainer's key as well.
# The maintainer downloads SHA256SUMS from the draft, signs it, uploads
# SHA256SUMS.minisig, and publishes. Steps in RELEASING.md.
#
# What the signature does NOT cover is a compromise of the build itself. The
# maintainer signs what this workflow produced, after checking it was this
# workflow that produced it; a poisoned build passes that check. So the job
# that runs the build -- which executes every dependency's build script --
# holds as little as possible:
#
#   * build:         contents: read only. No write token, no OIDC.
#   * draft-release: attests, checksums and drafts. Runs no project code.
#
# Every checkout sets persist-credentials: false (otherwise the token is left
# in .git/config for anything that runs later in the job), and every action
# is pinned to a full commit SHA with its version in a trailing comment, so a
# moved tag cannot change what runs here.
#
# Code quality is not gated here -- CI already ran on the commit being tagged.
# RELEASING.md makes checking that a precondition of tagging.

on:
  push:
    tags: ['v*']
  # Dry run from the Actions tab: exercises the whole build matrix and the
  # packaging steps without a tag, so the first real tag push is not also the
  # first test of the musl/cross toolchains. Attestation and the draft release
  # are skipped -- nothing is published.
  workflow_dispatch:

# Nothing by default; each job asks for exactly what it needs.
permissions: {}

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read # check out the code -- nothing else
    strategy:
      # If any target fails, stop the whole release rather than drafting a
      # partial one.
      fail-fast: true
      matrix:
        include:
          # musl rather than gnu: a fully static binary with no glibc floor,
          # so one Linux artifact runs on old and new distros alike. Worth it
          # here because rusqlite bundles SQLite as C, which musl-gcc handles.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
          # Intel macs still exist; the arm64 runner cross-compiles this fine.
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # A tag that disagrees with Cargo.toml would publish artifacts whose
      # --version output contradicts their filename. Refuse early, on every
      # matrix job, before any build minutes are spent.
      - name: Check tag against Cargo.toml version
        if: github.event_name == 'push'
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ "$tag" != "$crate" ]; then
            echo "tag is v$tag but Cargo.toml says $crate" >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # --locked: build exactly the dependency tree that CI tested and
      # cargo audit scanned, or fail loudly.
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          # On a dry run GITHUB_REF_NAME is a branch name, so the archive is
          # visibly labeled e.g. sk2-main-<target> rather than a version.
          version="${GITHUB_REF_NAME#v}"
          dir="sk2-${version}-${{ matrix.target }}"
          mkdir "$dir"
          cp README.md LICENSE CHANGELOG.md SECURITY.md "$dir/"
          # docs/ ships too: README links to docs/backup-security.md with a
          # relative path, which 404s inside the archive if the file is absent.
          cp -r docs "$dir/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/simpleKeychain2.exe" "$dir/sk2.exe"
            7z a "$dir.zip" "$dir"
          else
            cp "target/${{ matrix.target }}/release/simpleKeychain2" "$dir/sk2"
            tar czf "$dir.tar.gz" "$dir"
          fi

      # Attestation happens in draft-release, not here: an OIDC token in this
      # job would be within reach of every dependency's build script.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sk2-${{ matrix.target }}
          path: |
            sk2-*.tar.gz
            sk2-*.zip
          if-no-files-found: error

  draft-release:
    name: Draft the release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release and upload assets
      id-token: write # mint the OIDC identity that signs the attestation
      attestations: write # store the provenance attestation

    steps:
      # gh infers the repository from the checkout's remote; it authenticates
      # with GH_TOKEN below, so the checkout itself keeps no credentials.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      # Attest the archives themselves -- the files users download and verify,
      # not the bare binaries inside them. Before SHA256SUMS exists, so the
      # glob cannot pick it up. The provenance still names this workflow at
      # this tag, which is what `gh attestation verify` checks.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/sk2-*.tar.gz
            dist/sk2-*.zip

      # One SHA256SUMS over every archive, generated where all of them are in
      # one place. This is the file the maintainer signs locally.
      #
      # The source tarball is deliberately NOT built here. The maintainer
      # generates it with `git archive` and appends its hash to this file
      # before signing (RELEASING.md, "Add the source tarball"). Building it in
      # CI would look tidier and would quietly cost the whole point: artifact
      # and hash would then both come from the workflow, and the signature
      # would no longer be an independent check on it.
      - name: Generate SHA256SUMS
        working-directory: dist
        run: sha256sum -- * | tee SHA256SUMS

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --draft \
            --title "sk2 $GITHUB_REF_NAME" \
            --notes "See CHANGELOG.md for what changed. Verify downloads as described in SECURITY.md -- SHA256SUMS.minisig is uploaded by the maintainer before this release is published; if it is missing, the release is not ready."
