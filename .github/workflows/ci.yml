name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Advisories are published against dependency trees that have not changed, so
  # a push-only trigger would never see them. Weekly, Mondays 06:00 UTC.
  # This also re-runs the build against whatever `stable` has become, which
  # catches toolchain regressions between commits.
  schedule:
    - cron: '0 6 * * 1'
  # Manual runs (Actions tab, or `gh workflow run CI`). GitHub disables a repo's
  # scheduled workflows after 60 days without commits, and that turns off the
  # push trigger too -- so after re-enabling (`gh workflow enable CI`) the
  # commit already on main otherwise has no way to get a run. Happened
  # 2026-10-20.
  workflow_dispatch:

# Read-only, stated rather than inherited: the repository default is read today,
# but this keeps it read if that setting ever changes. Same pinning and
# persist-credentials rules as release.yml -- see the note at the top of it.
permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (all features)
        run: cargo clippy --all-features --all-targets -- -D warnings

      - name: Build (default features)
        run: cargo build

      - name: Build (no default features)
        run: cargo build --no-default-features

      - name: Test (default features)
        run: cargo test

      - name: Test (no default features)
        run: cargo test --no-default-features

  msrv:
    name: Minimum supported Rust version
    # `check` uses @stable, which only ever proves the newest compiler works. The
    # README's build instructions promise a floor, and nothing was testing it --
    # that is how the claim drifted to 1.85 while the code needed 1.88.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # Read the floor from Cargo.toml rather than repeating it here: a hardcoded
      # version would be one more fact stored twice, free to drift.
      - name: Read MSRV from Cargo.toml
        id: msrv
        run: echo "version=$(grep '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Building is the claim under test -- from source is currently the only
      # install path sk2 documents.
      - name: Build (default features)
        run: cargo build

      - name: Build (no default features)
        run: cargo build --no-default-features

  audit:
    name: Security advisories
    # Single runner: the dependency tree is platform-independent, so the OS
    # matrix would audit the same Cargo.lock three times.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      # Prebuilt binary — building cargo-audit from source takes ~3 minutes.
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-audit

      # --deny warnings also fails on informational advisories (unsound,
      # unmaintained), not just vulnerabilities. Deliberate for a password
      # manager: a finding should force a decision rather than scroll past.
      # To retire one after triage, add it to audit.toml:
      #   [advisories]
      #   ignore = ["RUSTSEC-YYYY-NNNN"]  # with a comment saying why
      - name: cargo audit
        run: cargo audit --deny warnings
