name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Advisories are published against dependency trees that have not changed, so
  # a push-only trigger would never see them. Weekly, Mondays 06:00 UTC.
  # This also re-runs the build against whatever `stable` has become, which
  # catches toolchain regressions between commits.
  schedule:
    - cron: '0 6 * * 1'

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (all features)
        run: cargo clippy --all-features --all-targets -- -D warnings

      - name: Build (default features)
        run: cargo build

      - name: Build (no default features)
        run: cargo build --no-default-features

      - name: Test (default features)
        run: cargo test

      - name: Test (no default features)
        run: cargo test --no-default-features

  msrv:
    name: Minimum supported Rust version
    # `check` uses @stable, which only ever proves the newest compiler works. The
    # README's build instructions promise a floor, and nothing was testing it --
    # that is how the claim drifted to 1.85 while the code needed 1.88.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Read the floor from Cargo.toml rather than repeating it here: a hardcoded
      # version would be one more fact stored twice, free to drift.
      - name: Read MSRV from Cargo.toml
        id: msrv
        run: echo "version=$(grep '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@v2

      # Building is the claim under test -- from source is currently the only
      # install path sk2 documents.
      - name: Build (default features)
        run: cargo build

      - name: Build (no default features)
        run: cargo build --no-default-features

  audit:
    name: Security advisories
    # Single runner: the dependency tree is platform-independent, so the OS
    # matrix would audit the same Cargo.lock three times.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      # Prebuilt binary — building cargo-audit from source takes ~3 minutes.
      - uses: taiki-e/install-action@cargo-audit

      # --deny warnings also fails on informational advisories (unsound,
      # unmaintained), not just vulnerabilities. Deliberate for a password
      # manager: a finding should force a decision rather than scroll past.
      # To retire one after triage, add it to audit.toml:
      #   [advisories]
      #   ignore = ["RUSTSEC-YYYY-NNNN"]  # with a comment saying why
      - name: cargo audit
        run: cargo audit --deny warnings
