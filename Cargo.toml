[package]
name = "simpleKeychain2"
version = "1.3.1"
edition = "2024"
# Set by the dependency with the highest floor: `rusqlite` 0.41 declares 1.89 (taken
# for the bundled-SQLite fix, RUSTSEC-2026-0459). sk2's own code needs 1.88 -- edition
# 2024 needs 1.85, and `vault_path` uses a let-chain (main.rs), stabilized in 1.88.
# Declared so cargo says "requires rustc 1.89" up front instead of failing mid-build.
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/gdfekaris/simpleKeychain2"

[features]
default = ["export", "import", "completion"]
export = []
import = []
# Shell completion. Gates the `completions` subcommand and the hidden
# `--list-services` flag behind it. Optional because it is the one path that
# reveals service names without a master password: `list` prompts, Tab does not.
# Building without it removes that surface from the binary entirely.
completion = []

[dependencies]
arboard = "3"
colored = "3"
argon2 = "0.5"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
dirs = "6"
rand = "0.8"
rpassword = "7"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1.8", features = ["alloc"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Same crate already in the dependency graph above -- integration tests are separate
# crates and cannot see the binary's dependencies, so it must be listed again here.
# Adds nothing new to Cargo.lock. Used by tests/cli.rs for forkpty.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

# Argon2 is deliberately expensive (128 MiB, 4 passes). Unoptimized it dominates
# test runtime -- the suite derives keys dozens of times, and the PTY integration
# tests drive real unlock prompts. Optimizing just the KDF crates keeps `cargo test`
# quick without optimizing the code under test.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
