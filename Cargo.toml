[package]
name = "simpleKeychain2"
version = "1.2.0"
edition = "2024"
# Edition 2024 needs 1.85, but `vault_path` uses a let-chain (main.rs), stabilized
# in 1.88. Declared so cargo reports "requires rustc 1.88" instead of leaving users
# with a bare E0658 about unstable `let` expressions.
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/gdfekaris/simpleKeychain2"

[features]
default = ["export", "import"]
export = []
import = []

[dependencies]
arboard = "3"
colored = "3"
argon2 = "0.5"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
dirs = "6"
rand = "0.8"
rpassword = "7"
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1.8", features = ["alloc"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Same crate already in the dependency graph above -- integration tests are separate
# crates and cannot see the binary's dependencies, so it must be listed again here.
# Adds nothing new to Cargo.lock. Used by tests/cli.rs for forkpty.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

# Argon2 is deliberately expensive (128 MiB, 4 passes). Unoptimized it dominates
# test runtime -- the suite derives keys dozens of times, and the PTY integration
# tests drive real unlock prompts. Optimizing just the KDF crates keeps `cargo test`
# quick without optimizing the code under test.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
